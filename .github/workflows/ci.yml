name: CI/CD — Catalog Service

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: fiap-sub/catalog-service
  PYTHON_VERSION: "3.11"

# ─────────────────────────────────────────────────────────────
# PR VALIDATION JOBS (lint, test, sonar, build)
# Rodam em todo PR para main e em push para main
# ─────────────────────────────────────────────────────────────

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Run black (check mode)
        run: black --check src/ tests/

  # ─────────────────────────────────────────────────────────────

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/catalog_test
      JWT_SECRET_KEY: ci-secret-key
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov-report=xml:coverage.xml
        env:
          PYTHONPATH: src

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    services:
      sonarqube:
        image: sonarqube:10-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        options: >-
          --health-cmd "curl -sf http://localhost:9000/api/system/ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Configure SonarQube — project, token e quality gate
        run: |
          SONAR_URL="http://localhost:9000"
          ADMIN_PASS="sonar-ci-$(date +%s)"

          # Alterar senha padrão do admin
          curl -sf -u admin:admin -X POST "$SONAR_URL/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=$ADMIN_PASS"

          # Criar projeto
          curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/projects/create" \
            -d "name=Catalog+Service&project=fiap-sub-fase4-catalog" || true

          # Gerar token de análise
          TOKEN=$(curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/user_tokens/generate" \
            -d "name=ci-token-$(date +%s)" | jq -r '.token')
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_ADMIN_PASS=$ADMIN_PASS" >> "$GITHUB_ENV"

          # Criar quality gate personalizado
          GATE_ID=$(curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/qualitygates/create" \
            -d "name=CI-Gate" | jq -r '.id')

          # Condição: cobertura geral >= 80%
          curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=coverage&op=LT&error=80"

          # Condição: rating de confiabilidade = A (sem bugs)
          curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=reliability_rating&op=GT&error=1"

          # Condição: rating de segurança = A (sem vulnerabilidades)
          curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=security_rating&op=GT&error=1"

          # Condição: rating de manutenibilidade = A (débito técnico < 5%)
          curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/qualitygates/create_condition" \
            -d "gateId=$GATE_ID&metric=sqale_rating&op=GT&error=1"

          # Associar quality gate ao projeto
          curl -sf -u "admin:$ADMIN_PASS" -X POST "$SONAR_URL/api/qualitygates/select" \
            -d "gateId=$GATE_ID&projectKey=fiap-sub-fase4-catalog"

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      - name: Check Quality Gate
        run: |
          SONAR_URL="http://localhost:9000"

          # Aguardar processamento da análise (background task)
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -u "admin:$SONAR_ADMIN_PASS" \
              "$SONAR_URL/api/qualitygates/project_status?projectKey=fiap-sub-fase4-catalog" \
              | jq -r '.projectStatus.status')
            if [ "$STATUS" != "NONE" ]; then
              break
            fi
            echo "Aguardando processamento... ($i/12)"
            sleep 5
          done

          echo "Quality Gate status: $STATUS"

          # Exibir condições com falha
          curl -sf -u "admin:$SONAR_ADMIN_PASS" \
            "$SONAR_URL/api/qualitygates/project_status?projectKey=fiap-sub-fase4-catalog" \
            | jq '.projectStatus.conditions[] | select(.status != "OK") | {metric: .metricKey, status: .status, actual: .actualValue, threshold: .errorThreshold}'

          if [ "$STATUS" != "OK" ]; then
            echo "❌ Quality Gate REPROVADO — nota abaixo de A ou cobertura < 80%"
            exit 1
          fi
          echo "✅ Quality Gate APROVADO"

  # ─────────────────────────────────────────────────────────────

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, sonar]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (sem push — validação de PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# DEPLOY JOBS (somente em push para main após merge do PR)
# ─────────────────────────────────────────────────────────────

  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-image.result == 'success'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────

  db-init:
    name: DB Init — MongoDB Indexes
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # O Beanie cria índices automaticamente no startup da aplicação.
    # Este job valida a conectividade e força o init antes do deploy.
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI_PROD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate MongoDB connectivity and init indexes
        run: |
          python - <<'EOF'
          import asyncio
          from infrastructure.database.mongodb import init_db

          async def main():
              await init_db()
              print("MongoDB connected and indexes initialized successfully.")

          asyncio.run(main())
          EOF
        env:
          PYTHONPATH: src

  # ─────────────────────────────────────────────────────────────

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: db-init
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/catalog-service \
            catalog-service=${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --namespace=catalog
          # --record foi removido: depreciado no kubectl >= 1.28

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/catalog-service \
            --namespace=catalog \
            --timeout=300s

      - name: Smoke test — health check
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            ${{ secrets.CATALOG_SERVICE_URL }}/health
